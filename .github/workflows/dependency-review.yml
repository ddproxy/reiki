name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Mirrors licenses.allow in deny.toml; the action cannot read TOML.
          allow-licenses: 'MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-3-Clause, BSL-1.0, CDLA-Permissive-2.0, ISC, Unicode-3.0, Unlicense, Zlib, NCSA'
