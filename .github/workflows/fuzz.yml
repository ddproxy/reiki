name: fuzz

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - sse_parser
          - scrub_forms
          - placeholders
          - redaction
          - json_pair
          - config_parse
          - key_file
          - path_normalization
          - tunnel_allowlist
          - headers
          - stream_admin_request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-11-20
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=120
      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 5
