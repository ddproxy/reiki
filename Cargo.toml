[workspace]
members = ["crates/reiki-detect", "crates/reiki-finance", "crates/reiki-controlled", "crates/reiki-health", "crates/reiki-metrics", "crates/reiki-phi", "crates/reiki-placeholders", "crates/reiki-plugin", "crates/reiki-redact", "crates/reiki-requestlog", "crates/reiki-toolpolicy", "crates/reiki-top", "crates/reiki-wasm"]
resolver = "2"

[package]
name = "reiki"
version = "0.14.0"
edition = "2024"
rust-version = "1.99"
description = "Security proxy for agent and LLM traffic: isolates keys, filters what leaves, keeps access reliable"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ddproxy/reiki"
keywords = ["proxy", "llm", "security", "api-key", "egress"]
categories = ["web-programming::http-server", "command-line-utilities"]
publish = false
build = "build.rs"

[[package.metadata.reiki.plugin]]
# Sees the original request, before placeholders swaps anything, and blocks before the log records it.
name = "phi"
feature = "plugin-phi"
crate = "reiki_phi"

[[package.metadata.reiki.plugin]]
name = "finance"
feature = "plugin-finance"
crate = "reiki_finance"

[[package.metadata.reiki.plugin]]
name = "controlled"
feature = "plugin-controlled"
crate = "reiki_controlled"

[[package.metadata.reiki.plugin]]
# Default chain order: placeholders must mask before the request log sees the request and,
# because responses run in reverse, restore only after the log has seen the response.
name = "placeholders"
feature = "plugin-placeholders"
crate = "reiki_placeholders"

[[package.metadata.reiki.plugin]]
name = "requestlog"
feature = "plugin-requestlog"
crate = "reiki_requestlog"

[[package.metadata.reiki.plugin]]
name = "metrics"
feature = "plugin-metrics"
crate = "reiki_metrics"

[[package.metadata.reiki.plugin]]
# Sees the upstream response before the request log records it.
name = "toolpolicy"
feature = "plugin-toolpolicy"
crate = "reiki_toolpolicy"

[build-dependencies]
toml = "1.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "gzip", "deflate", "brotli", "zstd"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "json"] }
reiki-plugin = { path = "crates/reiki-plugin" }
reiki-health = { path = "crates/reiki-health" }
reiki-detect = { path = "crates/reiki-detect" }
reiki-phi = { path = "crates/reiki-phi", optional = true }
reiki-finance = { path = "crates/reiki-finance", optional = true }
reiki-controlled = { path = "crates/reiki-controlled", optional = true }
reiki-placeholders = { path = "crates/reiki-placeholders", optional = true }
reiki-requestlog = { path = "crates/reiki-requestlog", optional = true }
reiki-metrics = { path = "crates/reiki-metrics", optional = true }
reiki-toolpolicy = { path = "crates/reiki-toolpolicy", optional = true }
reiki-top = { path = "crates/reiki-top", optional = true, default-features = false }
reiki-wasm = { path = "crates/reiki-wasm", optional = true }
futures-core = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
http-body-util = "0.1"
tower-service = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3", features = ["parsing"] }
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the log file; std has no constant for it.
libc = "0.2"
# Safe statvfs for the peer host stats; std has none and unsafe code is forbidden.
rustix = { version = "1", default-features = false, features = ["fs", "std"], optional = true }

[features]
default = ["plugin-phi", "plugin-finance", "plugin-controlled", "plugin-placeholders", "plugin-requestlog", "plugin-metrics", "plugin-toolpolicy", "peers"]
# Each compiled-in plugin is an optional dependency enabled by a feature of the same name.
plugin-phi = ["dep:reiki-phi"]
plugin-finance = ["dep:reiki-finance"]
plugin-controlled = ["dep:reiki-controlled"]
plugin-placeholders = ["dep:reiki-placeholders"]
plugin-requestlog = ["dep:reiki-requestlog"]
plugin-metrics = ["dep:reiki-metrics"]
plugin-toolpolicy = ["dep:reiki-toolpolicy"]
# Runtime Wasm plugins (phase 1 host); off by default.
plugin-wasm = ["dep:reiki-wasm"]
# Health sharing between instances; inert unless the config has an enabled `[peers]` table.
peers = ["dep:rustix"]
# `reiki top`: a live terminal fleet view of the configured peers.
top = ["peers", "dep:reiki-top", "reiki-top/tui"]
# Hub config: `[hubs]`, `[hub]` and `[accounts]` parse and validate; no listener or client is built.
hub = []
# Exposes bounded parser entry points to the cargo-fuzz targets in `fuzz/`. Never enabled by
# default or in a release build; see `src/fuzzing.rs` for what this adds to the public API.
fuzzing = ["peers"]

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Plugin panic isolation relies on unwinding, so panic must stay "unwind".
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
