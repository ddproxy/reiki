[workspace]
members = ["crates/reiki-metrics", "crates/reiki-placeholders", "crates/reiki-plugin", "crates/reiki-redact", "crates/reiki-requestlog"]
resolver = "2"

[package]
name = "reiki"
version = "0.7.0"
edition = "2021"
rust-version = "1.99"
description = "Key-failover relay for LLM APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ddproxy/reiki"
keywords = ["proxy", "api-key", "failover", "llm"]
categories = ["web-programming::http-server", "command-line-utilities"]
publish = false
build = "build.rs"

[[package.metadata.reiki.plugin]]
# Default chain order: placeholders must mask before the request log sees the request and,
# because responses run in reverse, restore only after the log has seen the response.
name = "placeholders"
feature = "plugin-placeholders"
crate = "reiki_placeholders"

[[package.metadata.reiki.plugin]]
name = "requestlog"
feature = "plugin-requestlog"
crate = "reiki_requestlog"

[[package.metadata.reiki.plugin]]
name = "metrics"
feature = "plugin-metrics"
crate = "reiki_metrics"

[build-dependencies]
toml = "0.8"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "gzip", "deflate", "brotli", "zstd"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "json"] }
reiki-plugin = { path = "crates/reiki-plugin" }
reiki-placeholders = { path = "crates/reiki-placeholders", optional = true }
reiki-requestlog = { path = "crates/reiki-requestlog", optional = true }
reiki-metrics = { path = "crates/reiki-metrics", optional = true }
futures-core = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots"] }
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
time = "0.3"
x509-parser = { version = "0.18", default-features = false }

[features]
default = ["plugin-placeholders", "plugin-requestlog", "plugin-metrics"]
# Each compiled-in plugin is an optional dependency enabled by a feature of the same name.
plugin-placeholders = ["dep:reiki-placeholders"]
plugin-requestlog = ["dep:reiki-requestlog"]
plugin-metrics = ["dep:reiki-metrics"]

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
