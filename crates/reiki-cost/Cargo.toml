[package]
name = "reiki-cost"
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
description = "Optional operator-priced usage accounting plugin for Reiki"
license = "MIT"
publish = false

[dependencies]
reiki-plugin = { path = "../reiki-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
