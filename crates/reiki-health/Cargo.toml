[package]
name = "reiki-health"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Shared wire types for Reiki peer health documents"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
