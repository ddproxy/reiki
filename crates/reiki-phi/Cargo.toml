[package]
name = "reiki-phi"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Reiki plugin that blocks or reports PHI and NPPI in outbound requests"
license = "MIT"
publish = false

[dependencies]
reiki-plugin = { path = "../reiki-plugin" }
http = "1"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
bytes = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
