[package]
name = "reiki-placeholders"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Reiki plugin that swaps sensitive values for placeholders on the way out and restores them on the way back"
license = "MIT"
publish = false

[dependencies]
reiki-plugin = { path = "../reiki-plugin" }
reiki-redact = { path = "../reiki-redact" }
bytes = "1"
http = "1"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
