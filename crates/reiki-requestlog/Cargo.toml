[package]
name = "reiki-requestlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reiki plugin that logs requests to a file and a live stream"
license = "MIT"
publish = false

[features]
# Exposes the redaction internals to the fuzz targets in `fuzz/`. Never enabled in a normal build.
fuzzing = []

[dependencies]
reiki-plugin = { path = "../reiki-plugin" }
reiki-redact = { path = "../reiki-redact" }
bytes = "1"
http = "1"
serde_json = "1"
toml = "1.2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW and O_NONBLOCK for the log file; std has no constants for them.
libc = "0.2"
# Safe fcntl wrappers: clearing O_NONBLOCK on the verified regular file must not need unsafe.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
