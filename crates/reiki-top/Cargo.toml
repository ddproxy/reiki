[package]
name = "reiki-top"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal data layer for peer key health: parse the health document and stream events"
license = "MIT"
publish = false

[features]
# The terminal layer. Off by default so the data and view layers build with serde only.
tui = ["dep:ratatui", "dep:crossterm", "dep:fw-tui"]

[dependencies]
reiki-health = { path = "../reiki-health" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"], optional = true }
fw-tui = { git = "https://github.com/ddproxy/fw-tui", rev = "8a9fb414c79d7784009e1a3ec3a3688e197931fe", default-features = false, features = ["tui"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
